name: Flutter CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Push server tests (PHP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax
        run: for f in server/lib/*.php server/public/api/*.php server/cron/*.php; do php -l "$f"; done
      - name: Tests
        run: php server/tests/run.php

  test:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test test

  build-apk:
    name: Build APK
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Release builds are signed with the debug key until a release
      # keystore is configured in android/app/build.gradle.kts.
      # Google's test ads unless the repository has the real AdMob ids as
      # Actions secrets (Settings → Secrets and variables → Actions).
      - name: AdMob ids
        env:
          BANNER: ${{ secrets.ADMOB_BANNER_ID }}
          INTERSTITIAL: ${{ secrets.ADMOB_INTERSTITIAL_ID }}
        run: |
          args=""
          [ -n "$BANNER" ] && args="$args --dart-define=ADMOB_BANNER_ID=$BANNER"
          [ -n "$INTERSTITIAL" ] && args="$args --dart-define=ADMOB_INTERSTITIAL_ID=$INTERSTITIAL"
          echo "AD_ARGS=$args" >> "$GITHUB_ENV"

      # Backup push (docs/alarm-reliability.md): off unless these secrets
      # are set. Gradle reads ORG_GRADLE_PROJECT_* as -P properties.
      - name: Backup push settings
        env:
          PUSH_SERVER_URL: ${{ secrets.PUSH_SERVER_URL }}
          PUSH_API_KEY: ${{ secrets.PUSH_API_KEY }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_SENDER_ID: ${{ secrets.FIREBASE_SENDER_ID }}
        run: |
          {
            echo "ORG_GRADLE_PROJECT_pushServerUrl=$PUSH_SERVER_URL"
            echo "ORG_GRADLE_PROJECT_pushApiKey=$PUSH_API_KEY"
            echo "ORG_GRADLE_PROJECT_firebaseAppId=$FIREBASE_APP_ID"
            echo "ORG_GRADLE_PROJECT_firebaseApiKey=$FIREBASE_API_KEY"
            echo "ORG_GRADLE_PROJECT_firebaseProjectId=$FIREBASE_PROJECT_ID"
            echo "ORG_GRADLE_PROJECT_firebaseSenderId=$FIREBASE_SENDER_ID"
          } >> "$GITHUB_ENV"

      - name: Build release APKs (one per ABI)
        env:
          ORG_GRADLE_PROJECT_admobAppId: ${{ secrets.ADMOB_APP_ID }}
        run: flutter build apk --release --split-per-abi $AD_ARGS

      # The same app with a "Generate Report" bar on every screen, for
      # finding out why alarms don't ring on a particular phone.
      - name: Build diagnostics APK
        env:
          ORG_GRADLE_PROJECT_admobAppId: ${{ secrets.ADMOB_APP_ID }}
        run: |
          flutter build apk --release $AD_ARGS --dart-define=READALARM_DIAGNOSTICS=true
          mkdir -p diagnostics
          cp build/app/outputs/flutter-apk/app-release.apk diagnostics/readalarm-diagnostics.apk

      - name: Build universal release APK
        env:
          ORG_GRADLE_PROJECT_admobAppId: ${{ secrets.ADMOB_APP_ID }}
        run: |
          flutter build apk --release $AD_ARGS
          cp diagnostics/readalarm-diagnostics.apk build/app/outputs/flutter-apk/

      # Every test APK must carry the same signature, or Android refuses
      # to install it over the last one ("App not installed").
      - name: Show the signing certificate
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$apksigner" verify --print-certs build/app/outputs/flutter-apk/app-release.apk | grep -i sha-256
          "$apksigner" verify --print-certs build/app/outputs/flutter-apk/readalarm-diagnostics.apk | grep -i sha-256

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: readalarm-apks-${{ github.sha }}
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30

  # Opens the release APK on an Android emulator: fresh (onboarding), and
  # past onboarding, where ads and billing start. Fails with the crash log
  # if the app closes.
  launch-check:
    name: Launch on emulator
    needs: build-apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: readalarm-apks-${{ github.sha }}
          path: apks

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build the past-onboarding APK
        run: |
          flutter pub get
          flutter build apk --release --target-platform android-x64 \
            --dart-define=READALARM_SKIP_ONBOARDING=true
          cp build/app/outputs/flutter-apk/app-release.apk apks/past-onboarding.apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            bash .github/scripts/launch_check.sh apks/app-release.apk fresh-install 30
            bash .github/scripts/launch_check.sh apks/past-onboarding.apk past-onboarding 45
            bash .github/scripts/launch_check.sh apks/readalarm-diagnostics.apk diagnostics 30

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: readalarm-launch-logs-${{ github.sha }}
          path: logcat/
          retention-days: 14

  screenshots:
    name: Regenerate screenshots
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Capture every screen
        run: flutter test screenshot_test

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: readalarm-screenshots-${{ github.sha }}
          path: screenshots/*.png
          retention-days: 30
