name: Flutter CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test test

  build-apk:
    name: Build APK
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Release builds are signed with the debug key until a release
      # keystore is configured in android/app/build.gradle.kts.
      # Google's test ads unless the repository has the real AdMob ids as
      # Actions secrets (Settings → Secrets and variables → Actions).
      - name: AdMob ids
        env:
          BANNER: ${{ secrets.ADMOB_BANNER_ID }}
          INTERSTITIAL: ${{ secrets.ADMOB_INTERSTITIAL_ID }}
          REWARDED: ${{ secrets.ADMOB_REWARDED_ID }}
        run: |
          args=""
          [ -n "$BANNER" ] && args="$args --dart-define=ADMOB_BANNER_ID=$BANNER"
          [ -n "$INTERSTITIAL" ] && args="$args --dart-define=ADMOB_INTERSTITIAL_ID=$INTERSTITIAL"
          [ -n "$REWARDED" ] && args="$args --dart-define=ADMOB_REWARDED_ID=$REWARDED"
          echo "AD_ARGS=$args" >> "$GITHUB_ENV"

      - name: Build release APKs (one per ABI)
        env:
          ORG_GRADLE_PROJECT_admobAppId: ${{ secrets.ADMOB_APP_ID }}
        run: flutter build apk --release --split-per-abi $AD_ARGS

      - name: Build universal release APK
        env:
          ORG_GRADLE_PROJECT_admobAppId: ${{ secrets.ADMOB_APP_ID }}
        run: flutter build apk --release $AD_ARGS

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: readalarm-apks-${{ github.sha }}
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30

  screenshots:
    name: Regenerate screenshots
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Capture every screen
        run: flutter test screenshot_test

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: readalarm-screenshots-${{ github.sha }}
          path: screenshots/*.png
          retention-days: 30
