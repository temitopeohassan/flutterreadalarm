name: readalarm
description: ReadAlarm — locked-screen alarm reader (UI screens).
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'   # Flutter 3.22+ (uses WidgetStateProperty)

dependencies:
  archive: ^4.3.0
  device_info_plus: ^13.2.0
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_foreground_task: ^11.0.3
  flutter_local_notifications: ^22.3.1
  flutter_timezone: ^5.1.0
  flutter_tts: ^4.2.5
  html: ^0.15.7
  path: ^1.9.1
  path_provider: ^2.1.6
  permission_handler: ^12.0.3
  syncfusion_flutter_pdf: ^35.1.37
  timezone: ^0.11.1
  xml: ^7.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
